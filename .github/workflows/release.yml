name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download Media Gecko tools
        shell: pwsh
        run: ./setup.ps1
      - name: Build installer artwork
        shell: pwsh
        run: ./scripts/build-installer-art.ps1
      - name: Build signed installer when signing secrets exist
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: pnpm exec electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: media-gecko-windows
          path: |
            dist/*.exe
            dist/*.blockmap
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: Media Gecko ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.exe
            dist/*.blockmap
